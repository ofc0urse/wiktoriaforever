<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<meta name="robots" content="noindex, nofollow">
<title>Hejj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@700&family=Nunito:wght@400;600;800&display=swap">
<style>
  :root {
    --papier: #FFFDF8;
    --tusz: #2A2422;
    --szary: #5C5350;
    --zielen: #2F6B3A;
    --zielen-ciemna: #22512B;
    --zielen-tlo: #E9F2EB;
    --blad: #A3322B;
    --odr: 'Caveat', 'Comic Sans MS', cursive;
    --tekst: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--papier); color: var(--tusz);
    font-family: var(--tekst); font-size: 17px; line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  .strona { max-width: 560px; margin: 0 auto; padding: 28px 16px calc(40px + env(safe-area-inset-bottom)); }
  .mala { font-family: var(--odr); font-size: 24px; font-weight: 700; color: var(--zielen); margin: 0; line-height: 1; }
  h1 { font-family: var(--odr); font-size: 52px; line-height: 0.95; font-weight: 700; margin: 4px 0 0; text-wrap: balance; }
  h2 { font-family: var(--odr); font-size: 34px; line-height: 1; font-weight: 700; margin: 0; }
  h3 { font-size: 19px; font-weight: 800; margin: 0; line-height: 1.25; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Logowanie */
  .logowanie { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .logowanie p { margin: 0; }
  .wiersz { display: flex; gap: 8px; }
  .pole {
    flex: 1 1 auto; min-width: 0; height: 52px; padding: 0 14px; border: 2px solid var(--tusz); border-radius: 12px;
    background: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
  }
  .pole:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--zielen); outline-offset: 2px; }
  .przycisk {
    flex: none; height: 52px; padding: 0 20px; border: 2px solid var(--zielen-ciemna); border-radius: 12px;
    background: var(--zielen); color: #fff; font-weight: 800; cursor: pointer;
  }
  .przycisk:hover { background: var(--zielen-ciemna); }
  .przycisk[disabled], .tekstowy[disabled] { opacity: 0.55; cursor: progress; }
  .tekstowy {
    min-height: 44px; padding: 0 4px; border: 0; background: none; font-weight: 800; cursor: pointer;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .komunikat { margin: 0; min-height: 1.45em; font-weight: 700; }
  .komunikat.zle { color: var(--blad); }
  .uwaga { font-size: 15px; color: var(--szary); }

  /* Nagłówek gry */
  .naglowek { display: flex; flex-direction: column; gap: 18px; margin-bottom: 26px; }
  .liczniki { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .licznik { border: 2px solid var(--tusz); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .licznik span:first-child { font-family: var(--odr); font-size: 24px; font-weight: 700; line-height: 1; }
  .kropki { display: flex; gap: 6px; align-items: center; }
  .kropka { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--tusz); }
  .kropka.uzyta { background: var(--tusz); }
  .kropki small { margin-left: 4px; font-size: 14px; color: var(--szary); font-weight: 600; }
  .litery { display: flex; flex-direction: column; gap: 6px; }
  .litery-rzad { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .litera {
    height: 46px; border: 2px dotted var(--zielen); border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: var(--zielen);
  }
  .litera.jest { border-style: solid; background: var(--zielen-tlo); }
  .etykieta { font-size: 14px; font-weight: 800; color: var(--szary); text-transform: uppercase; letter-spacing: 0.06em; }
  .nastepna { margin: 0; font-size: 15px; color: var(--szary); font-weight: 600; }
  .nastepna b { color: var(--tusz); }

  /* Dni i karty */
  .dni { display: flex; flex-direction: column; gap: 28px; }
  .dzien { display: flex; flex-direction: column; gap: 12px; }
  .dzien-tytul { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dzien-tytul .data { font-weight: 800; color: var(--szary); }
  .zamkniety {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px dashed #8A807C; border-radius: 14px; color: var(--szary);
  }
  .zamkniety svg { flex: none; }
  .zamkniety b { color: var(--tusz); }
  .karta { border: 2px solid var(--tusz); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
  .karta-gora { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .paczka { font-family: var(--odr); font-size: 26px; font-weight: 700; line-height: 1; }
  .typ { font-size: 13px; font-weight: 800; padding: 3px 10px; border: 2px solid var(--zielen); color: var(--zielen); border-radius: 999px; white-space: nowrap; }
  .tresc { margin: 0; white-space: pre-line; text-wrap: pretty; }
  .kod {
    padding: 14px; border-radius: 12px; background: var(--papier); border: 1.5px solid #D9D2CC;
    font-family: var(--mono); font-size: 20px; line-height: 1.6; letter-spacing: 0.04em; word-spacing: 0.1em;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .podp { margin: 0; padding: 10px 12px; border-radius: 12px; background: #FFF4D6; border: 1.5px solid #E2C46B; }
  .podp b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
  .akcje { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .pytanie { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--papier); border: 1.5px solid #D9D2CC; }
  .pytanie p { margin: 0; flex: 1 1 200px; font-weight: 700; }
  .pytanie .przycisk { height: 44px; }
  .trzes { animation: trzes 0.4s; }
  @keyframes trzes { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .trzes { animation: none; } }

  .karta.zrobiona { background: var(--zielen-tlo); border-color: var(--zielen); }
  .znacznik { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--zielen); }
  .otworz { margin: 0; font-family: var(--odr); font-size: 36px; line-height: 1; font-weight: 700; color: var(--zielen-ciemna); }
  .wiadomosc { margin: 0; white-space: pre-line; text-wrap: pretty; }
  .dostales { margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .dostales .litera { width: 46px; flex: none; }
  details summary { cursor: pointer; font-weight: 800; color: var(--szary); min-height: 32px; display: flex; align-items: center; }
  details[open] summary { margin-bottom: 8px; }
  details .kod { margin-top: 8px; font-size: 16px; }
  .final { border-width: 3px; }
  .final .otworz { font-size: 44px; }

  .stopka { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--szary); font-size: 14px; }
  .demo-pasek {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 20px; border-radius: 12px; background: #FFF4D6; border: 1.5px solid #E2C46B; font-size: 14px; font-weight: 700;
  }
  .demo-pasek .tekstowy { min-height: 32px; font-size: 14px; }
  .ladowanie { min-height: 70vh; display: flex; align-items: center; justify-content: center; font-family: var(--odr); font-size: 32px; color: var(--szary); }
  /* Skan twarzy */
  .skan, .czekanie { min-height: 86vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .skan p, .czekanie p { margin: 0; }
  .ramka {
    position: relative; width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--zielen); background: #EEE8E2; margin: 8px 0;
  }
  .ramka video, .ramka img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ramka video { transform: scaleX(-1); }
  .ramka .linia {
    position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--zielen);
    box-shadow: 0 0 14px 4px rgba(47, 107, 58, 0.55); animation: skanuj 2.2s ease-in-out infinite alternate;
  }
  .ramka.bez-kamery .linia, .ramka img ~ .linia { display: none; }
  @keyframes skanuj { from { top: 4%; } to { top: 95%; } }
  .ramka .licz { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
  .ramka.blysk::after { content: ''; position: absolute; inset: 0; background: #fff; animation: blysk 0.5s forwards; }
  @keyframes blysk { from { opacity: 1; } to { opacity: 0; } }
  .usmiech { font-family: var(--odr); font-size: 40px; font-weight: 700; line-height: 1; color: var(--zielen); }
  .skan-akcje { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .jako-przycisk { display: inline-flex; align-items: center; }
  /* Odliczanie */
  .zegar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
  .cyfra { border: 2px solid var(--tusz); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; background: #fff; }
  .cyfra b { font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cyfra small { font-size: 13px; font-weight: 800; color: var(--szary); }
  .kiedy { font-weight: 800; font-size: 19px; }
  .wielka { font-family: var(--odr); font-size: 140px; font-weight: 700; line-height: 1; color: var(--zielen); }
  .puls { animation: puls 0.8s ease-out; }
  @keyframes puls { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ramka .linia, .puls { animation: none; } }
  /* Kot do głaskania */
  .tytul-rzad { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .kot {
    position: relative; flex: none; width: 96px; height: 96px; padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  /* Przytrzymanie kota nie może zaznaczać tekstu obok ani otwierać menu. */
  .kot, .kot *, .tytul-rzad, .liczniki, .klodka, .czekanie .uwaga {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .kot svg { width: 100%; height: 100%; overflow: visible; }
  .kot .ogon { transform-origin: 86px 98px; animation: ogon 2.4s ease-in-out infinite; }
  @keyframes ogon { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
  .kot .zamkniete { display: none; }
  .kot.mruczy .otwarte { display: none; }
  .kot.mruczy .zamkniete { display: inline; }
  .kot.mruczy svg { animation: mrr 0.5s ease-out; }
  @keyframes mrr { 30% { transform: scale(1.08, 0.94); } 60% { transform: scale(0.97, 1.03); } }
  .dymek {
    position: absolute; top: -10px; right: 70px; padding: 4px 10px; border-radius: 12px; background: #fff; border: 2px solid var(--tusz);
    font-family: var(--odr); font-size: 22px; font-weight: 700; line-height: 1; white-space: nowrap; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .kot.mruczy .dymek { opacity: 1; }
  .serce { position: absolute; width: 18px; height: 18px; pointer-events: none; animation: serce 1.1s ease-out forwards; }
  @keyframes serce { from { transform: translateY(0) scale(0.6); opacity: 1; } to { transform: translateY(-70px) scale(1.2); opacity: 0; } }
  .deszcz { position: fixed; bottom: -30px; width: 26px; height: 26px; pointer-events: none; z-index: 50; animation: deszcz linear forwards; }
  @keyframes deszcz { from { transform: translateY(0) rotate(0); opacity: 1; } to { transform: translateY(-110vh) rotate(40deg); opacity: 0.2; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
    width: max-content; max-width: min(92vw, 420px); padding: 12px 16px; border-radius: 14px; background: var(--tusz); color: #fff; font-weight: 700; text-align: center;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); animation: toast 3.6s ease forwards; pointer-events: none;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .komunikat.jajko { color: var(--zielen-ciemna); }
  .kot-imie {
    position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); padding: 1px 8px; border-radius: 99px; background: var(--karta, #fff);
    border: 1.5px solid #D98A96; font-family: var(--odr); font-size: 18px; font-weight: 700; line-height: 1.2; color: #B8324F; white-space: nowrap; pointer-events: none;
  }
  .kot-imie.nowe { animation: litera 0.7s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .rybka { position: absolute; left: 50%; top: -60px; width: 38px; height: 24px; margin-left: -19px; pointer-events: none; animation: rybka 0.9s cubic-bezier(0.5, 0, 0.8, 0.6) forwards; }
  .rybka svg { width: 100%; height: 100%; }
  @keyframes rybka { 0% { transform: translateY(0) rotate(-20deg); opacity: 0; } 20% { opacity: 1; } 80% { transform: translateY(78px) rotate(15deg) scale(0.8); opacity: 1; } 100% { transform: translateY(86px) scale(0.2); opacity: 0; } }
  .kot.je svg { animation: mniam 0.4s ease-in-out 4 !important; }
  @keyframes mniam { 50% { transform: scale(1.06, 0.94); } }
  .ust-wybor svg { max-height: 30px; }
  .kot-imie-form { display: flex; flex-direction: column; gap: 6px; }
  .kot-imie-form[hidden] { display: none; }
  body.w-zabawach { background: #FFF3F5; }
  body.w-zabawach::before { display: none; }
  .zabawy { display: flex; flex-direction: column; gap: 14px; }
  .zabawy .mala { color: #B8324F; }
  .zabawy h1 { font-size: 60px; animation: wejdz 0.6s 0.05s both; }
  .zabawy h1.maly-h1 { font-size: 44px; }
  .zabawy h2 { margin-top: 10px; }
  .zabawy-wstep, .zabawy-opis, .zabawy-pusto { margin: 0; color: var(--szary); }
  .wstecz { align-self: flex-start; }
  .gra-karta, .topka-karta {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border-radius: 18px; border: 2px solid var(--tusz); background: #fff;
    text-align: left; cursor: pointer; animation: wejdz 0.5s both; transition: transform 0.15s, box-shadow 0.2s;
  }
  .gra-karta:active, .topka-karta:active { transform: scale(0.98); }
  .gra-karta b, .topka-karta b { display: block; font-size: 19px; }
  .gra-karta small, .topka-karta small { display: block; color: var(--szary); font-weight: 600; }
  .gra-karta small.rekord, .topka-karta small.rekord { color: var(--zielen); font-weight: 800; }
  .gra-ikona { width: 54px; height: 54px; flex: none; border-radius: 16px; background: #F6D8DC; display: flex; align-items: center; justify-content: center; font-family: var(--odr); font-size: 40px; font-weight: 700; color: #B8324F; }
  .topki { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
  .topka-okladki { display: flex; flex: none; }
  .topka-okladki img, .topka-okladki .brak-okl { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); background: #E9E1DC; }
  .topka-okladki > * + * { margin-left: -18px; }
  .utwory { display: flex; flex-direction: column; gap: 8px; }
  .utwor {
    display: grid; grid-template-columns: 40px 52px minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; padding: 8px 12px 8px 8px;
    border-radius: 14px; border: 2px solid #E6DAD6; background: #fff; text-align: left; cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .utwor:active { transform: scale(0.98); }
  .utwor img, .utwor .brak-okl, .prawdziwa img, .prawdziwa .brak-okl { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #E9E1DC; display: block; }
  .utwor .nr { font-family: var(--odr); font-size: 28px; font-weight: 700; color: #B8324F; text-align: center; }
  .utwor.wybrany { border-color: #B8324F; background: #FFF8F9; }
  .utwor.wybrany .nr { animation: litera 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .utwor-opis b { display: block; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
  .utwor-opis small { display: block; color: var(--szary); font-size: 13px; }
  .utwor.sprawdzony { cursor: default; animation: wejdz 0.4s both; animation-delay: var(--d, 0ms); }
  .utwor.trafiony { border-color: var(--zielen); background: var(--zielen-tlo); }
  .utwor.trafiony small { color: var(--zielen); font-weight: 800; }
  .utwor.pudlo small { color: #B8324F; font-weight: 800; }
  .topka-akcje { padding-top: 6px; }
  .wynik-topki { margin: 6px 0 0; font-size: 20px; }
  .prawdziwa { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .prawdziwa li { display: flex; align-items: center; gap: 12px; }
  .prawdziwa img, .prawdziwa .brak-okl { width: 40px; height: 40px; }
  .prawdziwa small { display: block; color: var(--szary); font-size: 13px; }
  .quiz-licznik { margin: 0; font-weight: 800; color: var(--szary); }
  .pasek-postepu.jasny { background: #F1E1E4; }
  .pasek-postepu.jasny span { background: linear-gradient(90deg, #B8324F, #F2C14E); }
  .quiz-pytanie { font-family: var(--tekst); font-size: 22px; font-weight: 800; line-height: 1.3; animation: wejdz 0.4s both; }
  .quiz-opcje { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opcja { min-height: 54px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--tusz); background: #fff; font-weight: 800; text-align: left; cursor: pointer; transition: transform 0.15s, background 0.2s, border-color 0.2s, opacity 0.2s; animation: wejdz 0.4s both; }
  .quiz-opcja:nth-child(2) { animation-delay: 0.05s; } .quiz-opcja:nth-child(3) { animation-delay: 0.1s; } .quiz-opcja:nth-child(4) { animation-delay: 0.15s; }
  .quiz-opcja:active { transform: scale(0.97); }
  .quiz-opcja.dobra { background: var(--zielen-tlo); border-color: var(--zielen); color: var(--zielen-ciemna); animation: swieza 0.6s; }
  .quiz-opcja.zla { background: #FBE3E6; border-color: #B8324F; color: #8E2238; animation: trzes 0.4s; }
  .quiz-opcja.wygaszona { opacity: 0.45; }
  .quiz-opcja[disabled] { cursor: default; }
  .quiz-kom { margin: 0; font-weight: 700; animation: wejdz 0.35s both; }
  .quiz-kom.ok { color: var(--zielen-ciemna); } .quiz-kom.nie { color: #8E2238; }
  .quiz-koniec { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 20px 0; }
  .wynik { margin: 0; font-family: var(--odr); font-size: 110px; font-weight: 700; line-height: 1; color: #B8324F; animation: litera 0.8s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .wynik span { font-size: 54px; color: var(--szary); }
  .wynik-tekst { margin: 0; font-size: 19px; font-weight: 700; }
  .nudzisz {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 34px; padding: 14px 16px; border-radius: 18px; border: 2px dashed #E3A8B3;
    background: #FFF6F8; color: var(--tusz); font-weight: 800; font-size: 16px; text-align: left; cursor: pointer; transition: transform 0.15s;
  }
  .nudzisz:active { transform: scale(0.98); }
  .nudzisz-pad { width: 52px; height: 38px; flex: none; animation: padKiwa 5s ease-in-out infinite; }
  .nudzisz-pad svg { width: 100%; height: 100%; display: block; }
  .czekanie .nudzisz { max-width: 420px; margin-top: 8px; }

  /* ===== Ruch ===== */
  body::before {
    content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none; will-change: transform;
    background: radial-gradient(circle at 15% 10%, rgba(246, 216, 220, 0.75), transparent 38%),
                radial-gradient(circle at 85% 90%, rgba(220, 235, 223, 0.8), transparent 40%);
    animation: plama 26s ease-in-out infinite alternate;
  }
  @keyframes plama { to { transform: translate(4%, 3%); } }
  body.na-strychu::before { display: none; }

  .przycisk, .tekstowy, .klodka, .karta, .licznik { transition: transform 0.15s ease, background-color 0.2s, box-shadow 0.25s, opacity 0.2s; }
  .przycisk:active, .tekstowy:active { transform: scale(0.95); }
  .karta:hover { box-shadow: 0 8px 22px rgba(42, 36, 34, 0.08); }
  .pole { transition: border-color 0.2s, box-shadow 0.2s; }
  .pole:focus { box-shadow: 0 0 0 4px rgba(47, 107, 58, 0.15); }

  @keyframes wejdz { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .czeka { opacity: 0; transform: translateY(22px); }
  .wejdz { animation: wejdz 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--d, 0ms); }
  .logowanie > *, .skan > *, .czekanie > * { animation: wejdz 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .logowanie > *:nth-child(2), .skan > *:nth-child(2), .czekanie > *:nth-child(2) { animation-delay: 0.08s; }
  .logowanie > *:nth-child(3), .skan > *:nth-child(3), .czekanie > *:nth-child(3) { animation-delay: 0.16s; }
  .logowanie > *:nth-child(4), .skan > *:nth-child(4), .czekanie > *:nth-child(4) { animation-delay: 0.24s; }
  .logowanie > *:nth-child(n+5), .skan > *:nth-child(n+5), .czekanie > *:nth-child(n+5) { animation-delay: 0.32s; }

  .karta.swieza { animation: swieza 0.7s cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes swieza { 0% { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(47, 107, 58, 0.5); } 60% { transform: scale(1.02); } 100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(47, 107, 58, 0); } }
  .karta.swieza .otworz { animation: wejdz 0.5s 0.15s both; }
  .litera.nowa { animation: litera 0.8s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes litera { 0% { transform: scale(0.3) rotate(-20deg); } 70% { transform: scale(1.25) rotate(6deg); } 100% { transform: none; } }
  .podp.swiezy { animation: wejdz 0.45s both; transform-origin: top; }
  .cyfra.tyk b { display: inline-block; animation: tyk 0.35s ease-out; }
  @keyframes tyk { from { transform: translateY(-6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .zamkniety { transition: transform 0.2s; }
  .klodka:active svg { animation: klodka 0.4s; }
  @keyframes klodka { 25% { transform: rotate(-14deg); } 50% { transform: rotate(10deg); } 75% { transform: rotate(-6deg); } }
  .kot .otwarte { transform-box: fill-box; transform-origin: center; animation: mrug 5.5s infinite; }
  @keyframes mrug { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .kot svg { animation: oddech 3.2s ease-in-out infinite; transform-origin: 60px 115px; }
  @keyframes oddech { 50% { transform: scale(1.02, 0.985); } }
  .skrzynia { animation: skrzynia 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--d, 0ms); }
  @keyframes skrzynia { from { opacity: 0; transform: translateY(30px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
  .strych h1 { animation: wejdz 0.7s 0.1s both; }
  .strych .mala, .strych-wstep { animation: wejdz 0.7s 0.2s both; }
  .pajeczyna { animation: pajeczyna 6s ease-in-out infinite alternate; transform-origin: top right; }
  @keyframes pajeczyna { to { transform: scaleX(-1) rotate(3deg); } }

  /* Przejście na strych: płynna zmiana koloru z jasnego na ciemny (i z powrotem) */
  .przejscie { position: fixed; inset: 0; z-index: 200; opacity: 0; transition: opacity 0.38s ease, background-color 0.65s ease; }
  .przejscie.widac { opacity: 1; }
  .przejscie.znika { opacity: 0; transition: opacity 0.5s ease; }
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .wejdz, .logowanie > *, .skan > *, .czekanie > *, .karta.swieza, .litera.nowa, .skrzynia, .kot svg, .kot .otwarte, .pajeczyna, .pajak { animation: none !important; }
    .czeka { opacity: 1; transform: none; }
  }
  /* Wzór w tle i ustawienia wyglądu */

// Deszcz dowolnego obrazka albo tekstu (ciasta, cyfry).
function deszcz(html, ile, klasa = '') {
  for (let i = 0; i < ile; i++) {
    const s = document.createElement('span');
    s.className = `deszcz ${klasa}`; s.innerHTML = html;
    s.style.left = `${Math.random() * 92}vw`;
    s.style.animationDuration = `${2.4 + Math.random() * 2}s`;
    s.style.animationDelay = `${Math.random() * 0.9}s`;
    document.body.append(s);
    setTimeout(() => s.remove(), 5500);
  }
}
function deszczLiczb() { deszcz('6', 10, 'cyfra-deszcz'); deszcz('7', 10, 'cyfra-deszcz'); }

// Godziny-niespodzianki (czas polski), codziennie. Przez całą tę minutę spadają torty.
const GODZINY_TORTOW = {
  '19:10': '19:10. Tak, to o tej godzinie się urodziłem ;) 15 października 2009.',
  '10:15': '10:15, czyli 15.10. Moje urodziny ;)',
  '03:26': '03:26, czyli 26.03. Twoje urodziny :)'
};
let aktywnaGodzina = null, pasekUrodzin = null;
function godzinaWarszawa() {
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
}
function sprawdzUrodziny() {
  const g = godzinaWarszawa();
  const tekst = GODZINY_TORTOW[g];
  if (aktywnaGodzina && aktywnaGodzina !== g) { aktywnaGodzina = null; pasekUrodzin?.remove(); pasekUrodzin = null; }
  if (tekst && !aktywnaGodzina) {
    aktywnaGodzina = g;
    odblokuj('tort' + g.replace(':', ''));
    pasekUrodzin = document.createElement('div');
    pasekUrodzin.className = 'pasek-urodzin'; pasekUrodzin.setAttribute('role', 'status');
    pasekUrodzin.textContent = tekst;
    document.body.append(pasekUrodzin);
  }
  if (tekst) deszcz(CIASTO, 6, 'ciasto');
}
setInterval(sprawdzUrodziny, 2500);
setTimeout(sprawdzUrodziny, 500);

let klikTytul = 0, klikCzas = 0;
function sekretTytulu() {
  const t = Date.now();
  klikTytul = t - klikCzas < 1500 ? klikTytul + 1 : 1;
  klikCzas = t;
  if (klikTytul === 5) { klikTytul = 0; odblokuj('sekret'); toast('Znalazłaś sekret. Ty naprawdę sprawdzasz wszystko, co? :)'); deszczSerc(10); }
}

function sprawdzNoc() {
  const h = new Date().getHours();

function demoApi() {

  const zapisz = () => { try { localStorage.setItem(KLUCZ, JSON.stringify(pam)); } catch (e) { /* trudno */ } };
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 2);
  const start = d.getTime();
  const otwarcie = (dz) => (pam.wszystko ? start : start + (dz - 1) * 86400000);
  const z = (nr) => DEMO_ZAGADKI.find((x) => x.nr === nr);
  return {
    demo: true,
    async zapamietany() { return pam.zalogowany; },
    async zaloguj(haslo) { if (await sha256(S.normalizuj(haslo)) !== HASLO_DEMO) throw { code: 'auth/invalid-credential' }; pam.zalogowany = true; zapisz(); },
    async wyloguj() { pam.zalogowany = false; zapisz(); },
    async harmonogram() { return { otwarcie }; },
    async zagadki() {
      return DEMO_ZAGADKI.map((x) => (Date.now() >= otwarcie(S.dzienPaczki(x.nr))

    },

    async sprawdz(zag, odp) { return z(zag.nr).odp.map(S.normalizuj).includes(S.normalizuj(odp)); },

/* ---------- prawdziwa gra (Firebase) ---------- */
async function firebaseApi() {
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{ initializeApp }, A, F] = await Promise.all([
    import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')
  ]);
  const app = initializeApp(CFG.firebase);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  let ustawienia = null;
  const mojPostep = () => F.doc(db, 'postep', auth.currentUser.uid);
  const naLiczby = (l) => (Array.isArray(l) ? l.map(Number) : []);
  return {
    demo: false,
    async zapamietany() {
      await auth.authStateReady();
      if (auth.currentUser && auth.currentUser.email !== CFG.graczEmail) { await A.signOut(auth); return false; }
      return !!auth.currentUser;
    },
    // Firebase wymaga min. 6 znaków, więc do wpisanego hasła doklejamy stałą końcówkę.
    async zaloguj(haslo) { await A.signInWithEmailAndPassword(auth, CFG.graczEmail, hasloFirebase(haslo)); },
    async zapiszZdjecie(obraz) { await F.addDoc(F.collection(db, 'zdjecia'), { obraz, kiedy: F.serverTimestamp() }); },
    async wyslijRysunek(obraz, wiadomosc) { await F.addDoc(F.collection(db, 'rysunki'), { obraz, wiadomosc, kiedy: F.serverTimestamp() }); },
    async rysunki() {
      const s = await F.getDocs(F.query(F.collection(db, 'rysunki'), F.orderBy('kiedy', 'desc'), F.limit(12)));
      return s.docs.map((d) => { const x = d.data(); return { obraz: x.obraz, wiadomosc: x.wiadomosc || '', kiedy: x.kiedy ? x.kiedy.toMillis() : Date.now() }; });
    },
    async zabawy() {
      const s = await F.getDoc(F.doc(db, 'ustawienia', 'zabawy'));
      return s.exists() ? s.data() : null;
    },
    async podpisy() {
      const s = await F.getDocs(F.collection(db, 'podpisy'));
      const o = {};
      s.docs.forEach((d) => { o[d.id === 'start' ? 'start' : Number(d.id)] = d.data().obraz; });
      return o;
    },
    async zapiszPodpis(id, obraz) {
      await F.setDoc(F.doc(db, 'podpisy', id === 'start' ? 'start' : nrId(id)), { obraz, kiedy: F.serverTimestamp() });
    },
    async wyloguj() { await A.signOut(auth); },
    async harmonogram() {
      const s = await F.getDoc(F.doc(db, 'ustawienia', 'gra'));
      if (!s.exists()) throw new Error('brak-gry');
      ustawienia = s.data();
      const [y, m, d] = String(ustawienia.start).split('-').map(Number);
      return {
        otwarcie: (dz) => S.warszawaNaUtc(y, m, d + dz - 1, Number(ustawienia.godzina) || 0),
        liczbaLiter: Number(ustawienia.liczbaLiter) || 7
      };
    },
    async zagadki() {
      const lista = [];
      for (let nr = 1; nr <= LICZBA; nr++) lista.push(nr);
      return Promise.all(lista.map(async (nr) => {
        try {
          const s = await F.getDoc(F.doc(db, 'zagadki', nrId(nr)));
          return s.exists() ? { ...s.data(), nr } : { nr, zablokowana: true };
        } catch (e) {
          if (e && e.code !== 'permission-denied') console.warn(e);
          return { nr, zablokowana: true };
        }
      }));
    },
    async postep() {
      const ref = mojPostep();
      const s = await F.getDoc(ref);
      if (!s.exists()) {
        const pusty = { rozwiazane: [], podpowiedzi: [], pominiete: [] };
        await F.setDoc(ref, pusty);
        return pusty;
      }
      const d = s.data();
      return { rozwiazane: naLiczby(d.rozwiazane), podpowiedzi: naLiczby(d.podpowiedzi), pominiete: naLiczby(d.pominiete) };
    },
    async sprawdz(zag, odp) {
      const h = await sha256(`${ustawienia.sol}|${nrId(zag.nr)}|${S.normalizuj(odp)}`);
      return Array.isArray(zag.hashe) && zag.hashe.includes(h);
    },
    async rozwiaz(nr) { await F.updateDoc(mojPostep(), { rozwiazane: F.arrayUnion(nrId(nr)) }); },
    async pomin(nr) { await F.updateDoc(mojPostep(), { pominiete: F.arrayUnion(nrId(nr)) }); },
    async podpowiedz(nr) {
      await F.updateDoc(mojPostep(), { podpowiedzi: F.arrayUnion(nrId(nr)) });
      const s = await F.getDoc(F.doc(db, 'podpowiedzi', nrId(nr)));
      return s.exists() ? s.data().tekst : '';
    },
    async nagroda(nr) {
      const s = await F.getDoc(F.doc(db, 'nagrody', nrId(nr)));
      return s.exists() ? s.data() : {};
    },
    async strych() {
      // Spis (bez treści) jest jawny dla gracza; treść każdej skrzyni serwer wydaje dopiero po jej godzinie.
      const spis = await F.getDoc(F.doc(db, 'ustawienia', 'strych'));
      const pozycje = spis.exists() && Array.isArray(spis.data().pozycje) ? spis.data().pozycje : [];
      return Promise.all(pozycje.map(async (poz) => {
        const kiedy = poz.odblokowanie ? poz.odblokowanie.toMillis() : 0;
        if (kiedy > Date.now()) return { zablokowana: true, odblokowanie: kiedy };
        try {
          const d = await F.getDoc(F.doc(db, 'strych', poz.id));
          return d.exists() ? { ...d.data(), odblokowanie: kiedy } : null;
        } catch (e) { return { zablokowana: true, odblokowanie: kiedy }; }
      })).then((l) => l.filter(Boolean));
    }
  };
}

const QUIZ_RUNDA = 10;
const mieszaj = (t) => { const a = t.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Każda runda to 10 losowych pytań. Najpierw lecą te, których jeszcze nie było; gdy się skończą, pula zaczyna się od nowa.
function losujRunde() {
  const wszystkie = (zab.dane.quiz || []).filter((p) => p && Array.isArray(p.odpowiedzi) && p.odpowiedzi[p.dobra] !== undefined);
  const ile = Math.min(QUIZ_RUNDA, wszystkie.length);
  let byly = czytaj('zostaw-quiz-widziane', []);
  if (!Array.isArray(byly)) byly = [];
  let nowe = mieszaj(wszystkie.filter((p) => !byly.includes(p.pytanie)));
  let runda = nowe.slice(0, ile);
  if (runda.length < ile) {
    const reszta = mieszaj(wszystkie.filter((p) => !runda.includes(p)));
    runda = runda.concat(reszta.slice(0, ile - runda.length));
    byly = [];
  }
  pisz('zostaw-quiz-widziane', byly.concat(runda.map((p) => p.pytanie)));
  // Odpowiedzi też w losowej kolejności, żeby nie zapamiętać „ta druga”.
  return mieszaj(runda).map((p) => {
    const kolej = mieszaj(p.odpowiedzi.map((_, k) => k));
    return { ...p, odpowiedzi: kolej.map((k) => p.odpowiedzi[k]), dobra: kolej.indexOf(p.dobra) };
  });
}

    const ok = zab.odp === p.dobra;
    tresc = `

  let akt = null, zegarek = null, startY = 0, krok = 0, z = 0, cel = 0, elementy = [];
  const zacznij = (el, y) => {
    akt = el; elementy = [...lista.children]; z = elementy.indexOf(el); cel = z; startY = y;

function osadzFilm(link) {
  let u;
  try { u = new URL(link); } catch (e) { return ''; }
  if (u.protocol !== 'https:') return '';
  let yt = null, pion = false;
  if (u.hostname === 'youtu.be') yt = u.pathname.slice(1);
  else if (/(^|\.)youtube\.com$/.test(u.hostname)) {
    if (u.pathname.startsWith('/shorts/')) { yt = u.pathname.split('/')[2]; pion = true; } else yt = u.searchParams.get('v');
  }
  if (yt && /^[\w-]{6,20}$/.test(yt)) {
    return `<div class="film${pion ? ' pion' : ''}"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="Film" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  }
  const dysk = u.hostname === 'drive.google.com' && u.pathname.match(/\/file\/d\/([\w-]+)/);
  if (dysk) return `<div class="film"><iframe src="https://drive.google.com/file/d/${dysk[1]}/preview" title="Film" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
  return `<a class="przycisk strych-link" href="${esc(u.href)}" target="_blank" rel="noopener">Otwórz</a>`;
}

let strychDane = null, strychObietnica = null;
function pobierzStrych(swiezo = false) {
  if (swiezo) strychObietnica = null;
  if (!strychObietnica) {
    strychObietnica = api.strych()
      .then((l) => { strychDane = l || []; return strychDane; })
      .catch((e) => { console.warn('strych:', e); strychObietnica = null; return null; });
  }
  return strychObietnica;
}
function wejdzNaStrych() {
  const stare = strychDane;
  const p = pobierzStrych(true);
  return schody('gora', async () => {
    widokStrychu(stare || [], !stare);
    p.then((l) => {
      if (!document.body.classList.contains('na-strychu')) return;
      if (l === null && stare) return; // brak sieci: zostaje to, co było
      if (stare && JSON.stringify(l) === JSON.stringify(stare)) return;
      widokStrychu(l || [], false, l === null);
    });
  });
}

const malyRuch = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let wTrakcieSchodow = false;
const KOLOR_JASNY = '#FFFDF8', KOLOR_STRYCH = '#241C19', KOLOR_SEKRETY = '#1B1A2E';
function schody(kierunek, potem) {
  return przejscieKolorem(kierunek === 'gora' ? KOLOR_JASNY : KOLOR_STRYCH, kierunek === 'gora' ? KOLOR_STRYCH : KOLOR_JASNY, potem);
}
async function przejscieKolorem(zKoloru, doKoloru, potem) {
  if (wTrakcieSchodow) return;
  // schowaj klawiaturę i odczekaj, aż telefon skończy zmieniać wysokość ekranu
  if (document.activeElement && document.activeElement.blur) { const bylo = document.activeElement.tagName === 'INPUT'; document.activeElement.blur(); if (bylo) await czekaj(320); }
  if (malyRuch()) { await potem(); return; }
  wTrakcieSchodow = true;
  const o = document.createElement('div');
  o.className = 'przejscie';
  o.setAttribute('aria-hidden', 'true');
  o.style.backgroundColor = zKoloru;
  document.body.append(o);
  void o.offsetWidth;
  o.classList.add('widac');            // 1. strona płynnie znika w swoim kolorze
  await czekaj(380);
  o.style.backgroundColor = doKoloru;  // 2. kolor płynnie przechodzi w drugi
  await czekaj(650);
  try { await potem(); } catch (e) { console.warn(e); }   // 3. podmiana pod zasłoną
  window.scrollTo(0, 0);
  await czekaj(60);
  o.classList.add('znika');            // 4. nowa strona płynnie się pojawia
  await czekaj(520);
  o.remove();
  wTrakcieSchodow = false;
}

function poRenderze() {

  if (st.swieza) { document.getElementById(`z${st.swieza}`)?.classList.add('swieza'); st.swieza = null; }
  st.nowaLiteraNr = null; st.nowaPodp = null;

function animujWejscie() {
  if (malyRuch() || !('IntersectionObserver' in window)) return;
  const el = [...document.querySelectorAll('.naglowek > *, .dzien')];
  el.forEach((e) => e.classList.add('czeka'));
  let kolejka = 0;
  const io = new IntersectionObserver((wpisy) => {
    wpisy.forEach((w) => {
      if (!w.isIntersecting) return;
      w.target.style.setProperty('--d', `${Math.min(kolejka++, 6) * 80}ms`);
      w.target.classList.remove('czeka'); w.target.classList.add('wejdz');
      io.unobserve(w.target);
    });
    setTimeout(() => { kolejka = 0; }, 250);
  }, { threshold: 0.05 });
  el.forEach((e) => io.observe(e));
}

async function wczytaj() {
  const h = await api.harmonogram();
  const [z, p] = await Promise.all([api.zagadki(), api.postep()]);
  st.otwarcie = h.otwarcie; st.liczbaLiter = h.liczbaLiter; st.zagadki = z; st.postep = p;
  try { st.podpisy = await api.podpisy(); } catch (e) { console.warn('podpisy:', e); st.podpisy = st.podpisy || {}; }
  const zrob = [...p.rozwiazane, ...p.pominiete].filter((nr) => !st.nagrody[nr]);
  await Promise.all(zrob.map(async (nr) => { st.nagrody[nr] = await api.nagroda(nr); }));
  const otwarteNr = z.filter((x) => !x.zablokowana).map((x) => x.nr);
  await Promise.all(p.podpowiedzi.filter((nr) => st.podpowiedzi[nr] === undefined && otwarteNr.includes(nr) && !zrobiona(nr))
    .map(async (nr) => { st.podpowiedzi[nr] = await api.podpowiedz(nr); }));
}

/* ---------- skan twarzy ---------- */
let strumien = null;
const zatrzymajKamere = () => { if (strumien) { strumien.getTracks().forEach((t) => t.stop()); strumien = null; } };
const czekaj = (ms) => new Promise((r) => setTimeout(r, ms));

function zrobZdjecie(zrodlo, w, h, lustro) {
  const s = Math.min(w, h), rozm = 480;
  const c = document.createElement('canvas');
  c.width = rozm; c.height = rozm;
  const ctx = c.getContext('2d');
  if (lustro) { ctx.translate(rozm, 0); ctx.scale(-1, 1); }
  ctx.drawImage(zrodlo, (w - s) / 2, (h - s) / 2, s, s, 0, 0, rozm, rozm);
  return c.toDataURL('image/jpeg', 0.75);
}

async function poSkanie(obraz) {
  zatrzymajKamere();
  const ramka = document.getElementById('ramka');
  if (obraz && ramka) ramka.innerHTML = `<img src="${obraz}" alt="Twoje zdjęcie">`;
  document.getElementById('skan-tytul').textContent = obraz ? 'Twarz rozpoznana' : 'Dobra, wierzę ci';
  document.getElementById('skan-opis').textContent = obraz ? 'To na pewno Ty :) Zdjęcie zapisane.' : 'Wpuszczam bez skanu.';
  document.getElementById('skan-akcje').innerHTML = '';
  document.querySelectorAll('.skan .uwaga').forEach((el) => el.remove());
  if (obraz) { try { await api.zapiszZdjecie(obraz); } catch (e) { console.warn(e); } }
  await czekaj(2200);
  await startGry(true, true);
}

  $app.innerHTML = `
    <main class="skan">
      <h1 id="skan-tytul">Zeskanuj swoją twarz</h1>

        <button class="przycisk" type="button" id="skanuj" disabled>Skanuj</button>

  const wideo = document.getElementById('wideo');

    document.getElementById('bez-skanu').onclick = () => poSkanie(null);
    document.getElementById('aparat').onchange = (ev) => {
      const f = ev.target.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => { const o = zrobZdjecie(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(img.src); poSkanie(o); };
      img.src = URL.createObjectURL(f);
    };
  }
}

/* ---------- odliczanie ---------- */
let zegar = null;
const stopZegar = () => { if (zegar) { clearInterval(zegar); zegar = null; } };
const dwa = (n) => String(n).padStart(2, '0');

function widokCzekania(cel) {
  stopZegar();
  $app.innerHTML = `
    <main class="czekanie">
      <p class="mala" data-sekret>Hejj :)</p>
      <h1>Pierwsza łamigłówka za</h1>
      <div class="zegar" id="zegar" role="timer" aria-live="off"></div>
      <p class="kiedy">${fmtDzien(cel)} o ${fmtGodz(cel)}</p>
      <p class="uwaga">Zajrzyj tu wtedy. Do tego czasu nic nie otwieraj :)</p>
      ${przyciskNudy()}
      ${kotWidoczny ? `${kotHTML()}<p class="uwaga">A w międzyczasie możesz pogłaskać kota.</p>` : ''}
      <span class="stopka-prawa">${przyciskWygladu()}<button class="tekstowy" type="button" data-a="wyloguj">Wyloguj</button></span>
    </main>`;
  const tik = () => {
    const ms = cel - Date.now();
    if (ms <= 0) { stopZegar(); startGry(true, true); return; }
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sek = s % 60;
    const el = document.getElementById('zegar');
    if (el) {
      el.innerHTML = [[d, d === 1 ? 'dzień' : 'dni'], [dwa(h), 'godz'], [dwa(m), 'min'], [dwa(sek), 'sek']]
        .map(([v, l], i) => `<span class="cyfra${i === 3 ? ' tyk' : ''}"><b>${v}</b><small>${l}</small></span>`).join('');
    }
  };
  tik();
  zegar = setInterval(tik, 1000);
}

async function odliczStart() {
  $app.innerHTML = '<main class="czekanie"><div class="wielka" id="wielka" aria-live="assertive"></div></main>';
  const el = document.getElementById('wielka');
  for (const t of ['3', '2', '1', 'Start!']) { el.textContent = t; el.classList.remove('puls'); void el.offsetWidth; el.classList.add('puls'); await czekaj(800); }
}

async function startGry(przewin = true, poSkanie = false) {
  stopZegar();
  try {
    await wczytaj();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `<main class="logowanie"><h1>Jeszcze chwila</h1>
      <p>${e && e.message === 'brak-gry' ? 'Gra nie jest jeszcze gotowa. Zajrzyj tu później.' : 'Nie udało się wczytać gry. Sprawdź internet i odśwież stronę.'}</p>
      <button class="tekstowy" type="button" data-a="wyloguj">Wyloguj</button></main>`;
    return;
  }
  if (!st.zagadki.some((z) => !z.zablokowana)) {
    const cel = st.otwarcie(1);
    if (cel > Date.now()) { widokCzekania(cel); return; }
  }
  widokGry();
  sprawdzNoc();
  if (st.strych) pobierzStrych();
  if (przewin) {
    const cel = st.zagadki.find((z) => !z.zablokowana && !zrobiona(z.nr));
    if (cel) document.getElementById(`z${cel.nr}`)?.scrollIntoView({ block: 'start' });
  }
}

/* ---------- akcje ---------- */
const BLAD_SIECI = 'Coś poszło nie tak. Sprawdź internet i spróbuj jeszcze raz.';

async function poZrobieniu(nr) {
  st.nagrody[nr] = await api.nagroda(nr);
  st.postep = await api.postep();
  st.swieza = nr;
}

$app.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'logowanie') {
    const haslo = document.getElementById('haslo').value;
    if (!haslo) return;
    f.querySelector('button').disabled = true;
    try {
      await api.zaloguj(haslo);
      let podpisy = {};
      try { podpisy = await api.podpisy(); } catch (e) { console.warn('podpisy:', e); }
      if (podpisy.start) await startGry(true); else widokPodpisuStart();
    } catch (e) {
      const c = e && e.code;
      const zleHaslo = ['auth/invalid-credential', 'auth/wrong-password', 'auth/invalid-login-credentials', 'auth/user-not-found'].includes(c);
      if (!zleHaslo) console.warn('logowanie:', e);
      widokLogowania(c === 'auth/too-many-requests' ? 'Za dużo prób. Odczekaj chwilę.'
        : (c === 'auth/network-request-failed' ? 'Brak internetu?'
          : (zleHaslo ? 'To nie to hasło.' : `Nie udało się zalogować (${c || (e && e.message) || 'nieznany błąd'}).`)));
    }
    return;
  }
  const nr = Number(f.dataset.nr);
  if (!nr || st.zajete) return;
  const pole = f.querySelector('input');
  const odp = pole.value;
  st.wpisane[nr] = odp;
  if (!S.normalizuj(odp)) { st.komunikat[nr] = { zle: true, tekst: 'Najpierw coś wpisz.' }; widokGry(); return; }
  // Rickroll: otwieramy od razu (jeszcze w kliknięciu), żeby telefon nie zablokował nowej karty.
  const kotNowy = SLOWA_KOTA.includes(S.normalizuj(odp)) && przywolajKota();
  if (kotNowy) setTimeout(() => { const k = document.querySelector('[data-kot]'); if (k) { k.classList.add('pojawia'); k.scrollIntoView({ block: 'center', behavior: 'smooth' }); } toast('Kot się pojawił! Pogłaszcz go :)'); }, 120);
  if (SLOWA_ZABAW.includes(S.normalizuj(odp))) {
    st.wpisane[nr] = '';
    wejdzDoZabaw();
    return;
  }
  if (SLOWA_SEKRETOW.includes(S.normalizuj(odp))) {
    st.wpisane[nr] = '';
    wejdzDoSekretow();
    return;
  }
  if (S.normalizuj(odp) === 'STRYCH') {
    st.strych = true; st.wpisane[nr] = '';
    odblokuj('strych');
    try { localStorage.setItem('zostaw-strych', '1'); } catch (e) { /* trudno, wpisze jeszcze raz */ }
    wejdzNaStrych();
    return;
  }
  if (RICKROLL.includes(S.normalizuj(odp))) {
    odblokuj('rickroll');
    const okno = window.open(RICK_URL, '_blank', 'noopener');
    st.komunikat[nr] = { jajko: true, tekst: okno ? 'Never gonna give you up :)' : 'Never gonna give you up :) (telefon zablokował nową kartę)' };
    widokGry();
    return;
  }
  st.zajete = nr; st.komunikat[nr] = null; widokGry();
  try {
    const z = st.zagadki.find((x) => x.nr === nr);
    if (await api.sprawdz(z, odp)) {
      await api.rozwiaz(nr);
      await poZrobieniu(nr);
      st.zajete = null; widokGry();
      document.getElementById(`z${nr}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else {
      st.zajete = null;
      const jajko = JAJKA[S.normalizuj(odp)];
      if (jajko && jajko.os) odblokuj(jajko.os);
      st.komunikat[nr] = jajko ? { jajko: true, tekst: jajko.tekst } : { zle: true, tekst: 'Jeszcze nie. Spróbuj inaczej.' };
      widokGry();
      if (jajko && jajko.serca) deszczSerc(14);
      if (jajko && jajko.liczby) deszczLiczb();
      if (S.normalizuj(odp) === 'MIAU') { const k = document.querySelector('[data-kot]'); if (k) glaszcz(k); }
      const el = document.getElementById(`odp${nr}`);
      if (el) { el.classList.add('trzes'); el.focus(); el.select(); }
    }
  } catch (e) {
    console.error(e);
    st.zajete = null; st.komunikat[nr] = { zle: true, tekst: BLAD_SIECI }; widokGry();
  }
});

$app.addEventListener('contextmenu', (ev) => { if (ev.target.closest('[data-kot], [data-klodka]')) ev.preventDefault(); });

$app.addEventListener('input', (ev) => {

$app.addEventListener('click', async (ev) => {
  const kot = ev.target.closest('[data-kot]');
  if (kot) { if (Date.now() < kotDlugieKoniec) return; glaszcz(kot); return; }
  if (ev.target.closest('[data-klodka]')) { odblokuj('klodka'); toast('Bardzo chciałbym ci dać klucz, ale musisz poczekać :('); return; }
  if (ev.target.closest('[data-sekret]')) { sekretTytulu(); return; }
  const b = ev.target.closest('button[data-a]');
  if (!b) return;
  const a = b.dataset.a, nr = Number(b.dataset.nr);
  if (a === 'wyloguj') {
    stopZegar(); zatrzymajKamere(); await api.wyloguj();
    st.strych = false; strychDane = null; strychObietnica = null; kotWidoczny = false; zdobyte = {}; zabawyOdkryte = false; zab.dane = null; zab.obietnica = null; document.body.classList.remove('na-strychu', 'w-sekretach', 'w-zabawach');
    try { ['zostaw-strych', 'zostaw-kot', 'zostaw-osiagniecia', 'zostaw-glaski', 'zostaw-zabawy', 'zostaw-quiz-rekord', 'zostaw-quiz-widziane', 'zostaw-topki-rekordy', 'zostaw-pf-rekord', 'zostaw-kot-imie', 'zostaw-karmienie'].forEach((k) => localStorage.removeItem(k)); glaski = 0; karmienia = 0; } catch (e) { /* nic */ }
    widokLogowania(); return;
  }
  if (a === 'strych') { b.classList.add('wspina'); await czekaj(380); wejdzNaStrych(); return; }
  if (a === 'podpis-czysc') { wyczyscPodpis(b.dataset.id); return; }
  if (a === 'podpis-cofnij') { cofnijPodpis(b.dataset.id); return; }
  if (a === 'podpis-kolor') { ustawPodpis(b, 'kolor'); return; }
  if (a === 'podpis-grubosc') { ustawPodpis(b, 'g'); return; }
  if (a === 'podpis-start') { await podpiszStart(b); return; }
  if (a === 'podpis-paczka') { await odbierzPaczke(Number(b.dataset.nr), b); return; }
  if (a === 'ze-strychu') { zejdzZeStrychu(); return; }
  if (a === 'z-sekretow') { wyjdzZSekretow(); return; }
  if (a === 'zabawy') { wejdzDoZabaw(); return; }
  if (a === 'z-zabaw') { wyjdzZZabaw(); return; }
  if (a === 'zabawy-menu') { zab.tryb = 'menu'; widokZabaw(); return; }
  if (a === 'plastyka') { widokPlastyki(); return; }
  if (a === 'rysunek-wyslij') { wyslijRysunek(b); return; }
  if (a === 'quiz-start') { if (zab.dane) startQuiz(); return; }
  if (a === 'quiz-odp') { if (zab.odp === null) { zab.odp = Number(b.dataset.k); if (zab.odp === zab.runda[zab.i].dobra) zab.wynik += 1; widokQuizu(); } return; }
  if (a === 'quiz-dalej') { zab.i += 1; zab.odp = null; widokQuizu(); window.scrollTo(0, 0); return; }
  if (a === 'topka') { if (zab.dane) { startTopka(b.dataset.id); window.scrollTo(0, 0); } return; }
  if (a === 'topka-gora') { const i = Number(b.dataset.poz); przesunTopke(i, i - 1); widokTopki(); return; }
  if (a === 'topka-dol') { const i = Number(b.dataset.poz); przesunTopke(i, i + 1); widokTopki(); return; }
  if (a === 'topka-od-nowa') { startTopka(zab.topka.id); return; }
  if (a === 'pf-start') { if (zab.dane) { startPF(); window.scrollTo(0, 0); } return; }
  if (a === 'pf-odp') { if (zab.odp === null) { zab.odp = b.dataset.v === '1'; if (zab.odp === !!zab.pf[zab.i].prawda) zab.wynik += 1; widokPF(); } return; }
  if (a === 'pf-dalej') { zab.i += 1; zab.odp = null; widokPF(); window.scrollTo(0, 0); return; }
  if (a === 'topka-sprawdz') { zab.sprawdzone = true; widokTopki(); window.scrollTo(0, 0); return; }
  if (a === 'sekrety') { wejdzDoSekretow(); return; }
  if (a === 'demo-odliczanie') { widokCzekania(Date.now() + 2 * 86400000 + 3 * 3600000); return; }
  if (a === 'demo-wszystko') { api.otworzWszystko(); await startGry(false); return; }
  if (a === 'demo-czysc') { st.strych = false; try { localStorage.removeItem('zostaw-strych'); } catch (e) { /* nic */ } api.wyczysc(); st.nagrody = {}; st.podpowiedzi = {}; st.wpisane = {}; st.komunikat = {}; await startGry(false); return; }
  if (a === 'podp' || a === 'pomin') { st.pytanie = { nr, co: a }; widokGry(); return; }
  if (a === 'nie') { st.pytanie = null; widokGry(); return; }
  if (a === 'tak' && st.pytanie && !st.zajete) {
    const co = st.pytanie.co;
    st.zajete = nr; widokGry();
    try {
      if (co === 'podp') {
        st.podpowiedzi[nr] = await api.podpowiedz(nr);
        st.nowaPodp = nr;
        st.postep = await api.postep();
      } else {
        await api.pomin(nr);
        await poZrobieniu(nr);
      }
      st.pytanie = null; st.zajete = null; widokGry();
    } catch (e) {
      console.error(e);
      st.pytanie = null; st.zajete = null; st.komunikat[nr] = { zle: true, tekst: BLAD_SIECI }; widokGry();
    }
  }
});

// Co pół minuty: odśwież „za ile”, a gdy wybije godzina, wczytaj nowe zagadki.
let sprawdzanie = 0;
async function odswiezZagadki() {
  try {
    const nowe = await api.zagadki();
    const bylo = st.zagadki.filter((z) => !z.zablokowana).length;
    st.zagadki = nowe;
    const naGrze = !['na-strychu', 'w-sekretach', 'w-zabawach'].some((k) => document.body.classList.contains(k)) && document.querySelector('.naglowek');
    if (nowe.filter((z) => !z.zablokowana).length !== bylo) {
      if (document.querySelector('.czekanie')) { startGry(true); return; }
      if (naGrze && !st.zajete) { widokGry(); toast('Nowa zagadka się otworzyła!'); }
    }
  } catch (e) { /* spróbuje znowu */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.postep) odswiezZagadki(); });
setInterval(async () => {
  if (!st.postep || !st.otwarcie || st.zajete) return;
  const zamkniete = st.zagadki.filter((z) => z.zablokowana);
  sprawdzanie += 1;
  // co ~1 minutę (albo gdy minie godzina z planu) sprawdzamy, czy jakaś paczka nie została otwarta, także ręcznie w panelu
  if (zamkniete.length && document.visibilityState === 'visible' && (sprawdzanie % 2 === 0 || zamkniete.some((z) => Date.now() >= st.otwarcie(S.dzienPaczki(z.nr))))) {
    await odswiezZagadki();
  } else {
    const el = document.getElementById('nastepna');
    if (el) {
      for (let d = 1; d <= 8; d++) {
        const t = st.otwarcie(d);
        if (t > Date.now()) { el.innerHTML = `Następne zagadki: <b>${fmtDzien(t)} o ${fmtGodz(t)}</b> (${zaIle(t)})`; break; }
      }
    }
  }
}, 30000);
